name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    env:
      STOCKWISE_API_ORIGIN: http://127.0.0.1:3001
      TEST_DATABASE_URL: postgresql://stockwise_test_runner:stockwise_test_runner_only@127.0.0.1:5432/stockwise_test?schema=public
      STOCKWISE_ALLOW_STOCKWISE_TEST: "1"
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: stockwise_test_runner_only
          POSTGRES_USER: stockwise_test_runner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=stockwise_test_runner --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Install Chromium for browser-backed test contracts
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
